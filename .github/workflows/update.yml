name: Update playlists

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      INPUT_M3U_URL: https://iptv-org.github.io/iptv/countries/in.m3u
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install aiohttp

      - name: Update playlists
        run: python update_playlist.py

      - name: Commit changed playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/*.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes detected."
            exit 0
          fi
          git commit -m "chore: update playlists"
          git push origin HEAD:main
